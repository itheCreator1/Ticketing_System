x-backend-env: &backend-env
  DJANGO_ENV: ${DJANGO_ENV:-production}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
  # Must include PUBLIC_HOST (below); Django always adds the internal hostname "backend" itself.
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_MEDIA_ROOT: /app/media
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-sd}
  POSTGRES_USER: ${POSTGRES_USER:-sd}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sd}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sd}
      POSTGRES_USER: ${POSTGRES_USER:-sd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: { context: ../backend, target: base }
    image: servicedesk-backend:${IMAGE_TAG:-local}
    environment: *backend-env
    volumes:
      - media:/app/media
    depends_on: { db: { condition: service_healthy } }

  scheduler:
    build: { context: ../backend, target: scheduler }
    image: servicedesk-scheduler:${IMAGE_TAG:-local}
    environment: *backend-env
    volumes:
      - media:/app/media
    depends_on: { db: { condition: service_healthy } }

  frontend:
    build: { context: ../frontend }
    image: servicedesk-frontend:${IMAGE_TAG:-local}
    environment:
      INTERNAL_API_URL: http://backend:8000
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}   # the site's public host name; must be in DJANGO_ALLOWED_HOSTS
    depends_on: { backend: { condition: service_healthy } }

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: { frontend: { condition: service_healthy } }

volumes:
  pgdata: {}
  media: {}
  caddy_data: {}
